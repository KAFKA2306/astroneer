name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "io/**"
      - "data/**"
      - "design.config.json"
      - "design.lock.json"
      - "scripts/audit_wiki.py"
      - "scripts/verify_production.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  design-conformance:
    uses: KAFKA2306/design/.github/workflows/conformance.yml@e5163339966b6c89f62580d917634ed80b2acb25

  deploy:
    needs: design-conformance
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enforce complete wiki
        run: python scripts/audit_wiki.py --strict
      - name: Stage site
        run: |
          mkdir -p _site
          cp -R io _site/io
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify production runtime
        run: python scripts/verify_production.py
