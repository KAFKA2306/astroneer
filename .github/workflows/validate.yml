name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Japanese guide
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path

          page = Path("io/index.html")
          if not page.exists():
              raise SystemExit("io/index.html is missing")

          readme = Path("README.md").read_text(encoding="utf-8")
          expected_url = "https://kafka2306.github.io/astroneer/io/"
          if readme.splitlines()[0].strip() != expected_url:
              raise SystemExit("README first line must be the production /io/ URL")

          html = page.read_text(encoding="utf-8")
          required = [
              'lang="ja"',
              'id="start"',
              'id="sylvie"',
              'id="usagi"',
              'id="stilgar"',
              'id="princess"',
              'id="rogal"',
              'id="bestefar"',
              'id="enoki"',
              'id="complete"',
              'id="feeding"',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"required guide structure missing: {missing}")

          class Parser(HTMLParser):
              pass

          Parser().feed(html)

          assets = (
              list(Path(".").rglob("*.png"))
              + list(Path(".").rglob("*.jpg"))
              + list(Path(".").rglob("*.jpeg"))
              + list(Path(".").rglob("*.webp"))
          )
          if assets:
              raise SystemExit(f"image files must stay external links: {assets}")

          if html.count("astroneer.wiki.gg/wiki/") < 7:
              raise SystemExit("official wiki source links are incomplete")

          if Path("index.html").exists():
              raise SystemExit("root index.html must not duplicate the /io/ canonical page")

          print("Pages /io/ guide structure is valid.")
