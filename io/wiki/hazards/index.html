<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>危険源 | ASTRONEER 日本語Wiki</title><meta name="description" content="危険植物、落下、酸素切れ、爆発など、探索中にプレイヤーを負傷・死亡させる要因です。"><meta name="wiki-source" content="https://astroneer.wiki.gg/wiki/Hazards"><meta name="last-verified" content="2026-09-06"><link rel="stylesheet" href="../../assets/wiki.css"></head><body><header><nav><a href="../../">ASTRONEER 日本語Wiki</a> / <a href="../../category/systems/">ゲームシステム</a> / 危険源</nav><h1>危険源</h1><p class="lead">危険植物、落下、酸素切れ、爆発など、探索中にプレイヤーを負傷・死亡させる要因です。</p></header><main><h2>要点</h2><div class="box"><ul><li>惑星ごとに危険な植物や環境上の障害があります。</li><li>高所からの落下や酸素切れも代表的な死亡原因です。</li><li>爆発物や危険物はプレイヤーや周辺設備を巻き込むことがあります。</li></ul></div><h2>関連記事</h2><div class="related"><a href="../oxygen/">酸素</a><a href="../death/">死亡</a><a href="../terrain/">地形</a></div><h2>参照</h2><p><a href="https://astroneer.wiki.gg/wiki/Hazards">Official Astroneer Wiki</a></p><p class="meta">最終確認: 2026-09-06</p></main><footer><a href="../../">Wikiトップへ戻る</a></footer></body></html>
