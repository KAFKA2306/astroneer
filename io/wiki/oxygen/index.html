<!doctype html><html lang="ja" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>酸素 | ASTRONEER 日本語Wiki</title><meta name="description" content="プレイヤーの生存に必要です。基地、Oxygenator、Tether、車両などを使って探索範囲へ供給します。"><meta name="wiki-source" content="https://astroneer.wiki.gg/wiki/Oxygen"><meta name="last-verified" content="2026-09-06"><link rel="stylesheet" href="../../assets/wiki.css"></head><body><header><nav><a href="../../">ASTRONEER 日本語Wiki</a> / <a href="../../category/player/">プレイヤー</a> / 酸素</nav><h1>酸素</h1><p class="lead">プレイヤーの生存に必要です。基地、Oxygenator、Tether、車両などを使って探索範囲へ供給します。</p></header><main><h2>要点</h2><div class="box"><ul><li>酸素供給から離れると携行酸素を消費し、尽きると窒息します。</li><li>Oxygenator に接続した Tether 網は探索中の酸素供給路になります。</li><li>一部の車両や拠点設備も酸素ネットワークの中継点になります。</li></ul></div><h2>関連記事</h2><div class="related"><a href="../backpack/">バックパック</a><a href="../death/">死亡</a><a href="../hazards/">危険源</a></div><h2>参照</h2><p><a href="https://astroneer.wiki.gg/wiki/Oxygen">Official Astroneer Wiki</a></p><p class="meta">最終確認: 2026-09-06</p></main><footer><a href="../../">Wikiトップへ戻る</a></footer></body></html>
