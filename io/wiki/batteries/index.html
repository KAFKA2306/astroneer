<!doctype html><html lang="ja" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バッテリー | ASTRONEER 日本語Wiki</title><meta name="description" content="余剰電力を蓄え、発電量が不足したときにネットワークへ戻す蓄電装置です。"><meta name="wiki-source" content="https://astroneer.wiki.gg/wiki/Batteries"><meta name="last-verified" content="2026-09-06"><link rel="stylesheet" href="../../assets/wiki.css"></head><body><header><nav><a href="../../">ASTRONEER 日本語Wiki</a> / <a href="../../category/items/">アイテム</a> / バッテリー</nav><h1>バッテリー</h1><p class="lead">余剰電力を蓄え、発電量が不足したときにネットワークへ戻す蓄電装置です。</p></header><main><h2>要点</h2><div class="box"><ul><li>発電源ではなく蓄電装置なので、空のBatteryだけでは継続運転できません。</li><li>Solar/Windの出力変動を吸収する用途に向きます。</li><li>車両に載せると充電済み電力を走行へ使えます。</li></ul></div><h2>関連記事</h2><div class="related"><a href="../power/">電力</a><a href="../solar/">太陽光発電</a><a href="../wind/">風力発電</a></div><h2>参照</h2><p><a href="https://astroneer.wiki.gg/wiki/Batteries">Official Astroneer Wiki</a></p><p class="meta">最終確認: 2026-09-06</p></main><footer><a href="../../">Wikiトップへ戻る</a></footer></body></html>
