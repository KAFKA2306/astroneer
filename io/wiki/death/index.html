<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>死亡 | ASTRONEER 日本語Wiki</title><meta name="description" content="酸素切れ、落下、危険植物などで死亡すると、所持品を回収する必要が生じます。"><meta name="wiki-source" content="https://astroneer.wiki.gg/wiki/Death"><meta name="last-verified" content="2026-09-06"><link rel="stylesheet" href="../../assets/wiki.css"></head><body><header><nav><a href="../../">ASTRONEER 日本語Wiki</a> / <a href="../../category/player/">プレイヤー</a> / 死亡</nav><h1>死亡</h1><p class="lead">酸素切れ、落下、危険植物などで死亡すると、所持品を回収する必要が生じます。</p></header><main><h2>要点</h2><div class="box"><ul><li>死亡地点には所持していたバックパックとアイテムが残ります。</li><li>再出現後、死亡地点のマーカーを手掛かりに装備を回収できます。</li><li>復帰地点は利用していた Shelter や Shuttle などに依存します。</li></ul></div><h2>関連記事</h2><div class="related"><a href="../hazards/">危険源</a><a href="../oxygen/">酸素</a><a href="../backpack/">バックパック</a></div><h2>参照</h2><p><a href="https://astroneer.wiki.gg/wiki/Death">Official Astroneer Wiki</a></p><p class="meta">最終確認: 2026-09-06</p></main><footer><a href="../../">Wikiトップへ戻る</a></footer></body></html>
